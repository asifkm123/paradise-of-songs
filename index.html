<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paradise of Songs - Web Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --primary: #06b6d4;
      --primary-glow: rgba(6, 182, 212, 0.35);
      --bg-dark: #0a0f1d;
      --card-bg: rgba(16, 24, 40, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.12) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .brand i {
      color: var(--primary);
      text-shadow: 0 0 16px var(--primary-glow);
    }

    .main-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 32px;
      padding: 32px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 992px) {
      .main-container {
        grid-template-columns: 1fr;
      }
    }

    /* Active Player Screen */
    .player-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .cover-art-container {
      width: 260px;
      height: 260px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5);
      position: relative;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .cover-art-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .playing .cover-art-container img {
      transform: scale(1.05);
    }

    .track-meta {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
    }

    .track-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 1rem;
      color: var(--text-sub);
    }

    /* Audio Visualizer Canvas */
    #visualizer {
      width: 100%;
      height: 70px;
      margin-bottom: 24px;
      border-radius: 12px;
    }

    /* Progress Bar */
    .progress-wrapper {
      width: 100%;
      margin-bottom: 28px;
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-top: 8px;
    }

    .progress-bar-container {
      position: relative;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      cursor: pointer;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 10px;
      position: relative;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .btn-action {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.25rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
    }

    .btn-action:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    .btn-play {
      width: 64px;
      height: 64px;
      background: var(--primary);
      color: #041017;
      font-size: 1.5rem;
      border-radius: 50%;
      box-shadow: 0 0 24px var(--primary-glow);
    }

    .btn-play:hover {
      background: #22d3ee;
      transform: scale(1.06);
      color: #041017;
    }

    /* Playlist Section */
    .playlist-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(20px);
      max-height: 700px;
    }

    .playlist-header {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .playlist-count {
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 10px;
      border-radius: 12px;
      color: var(--text-sub);
    }

    .playlist-items {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .playlist-items::-webkit-scrollbar {
      width: 5px;
    }

    .playlist-items::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .track-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .track-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .track-item.active {
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .track-item.active .item-title {
      color: var(--primary);
    }

    .item-cover {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
    }

    .item-details {
      flex: 1;
      overflow: hidden;
    }

    .item-title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-artist {
      font-size: 0.75rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <i class="fa-solid fa-compact-disc fa-spin" style="--fa-animation-duration: 4s;"></i>
      <span>Paradise of Songs</span>
    </div>
    <div style="font-size: 0.85rem; color: var(--text-sub);">
      <i class="fa-solid fa-bolt" style="color: var(--primary);"></i> Nextcloud Direct Stream
    </div>
  </header>

  <main class="main-container">
    <!-- Active Player UI -->
    <section class="player-card" id="playerContainer">
      <div class="cover-art-container">
        <img id="currentCover" src="" alt="Album Art" />
      </div>

      <div class="track-meta">
        <div class="track-title" id="currentTitle">Select a track</div>
        <div class="track-artist" id="currentArtist">-</div>
      </div>

      <!-- Frequency Visualizer -->
      <canvas id="visualizer"></canvas>

      <!-- Progress -->
      <div class="progress-wrapper">
        <div class="progress-bar-container" id="progressContainer">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="time-info">
          <span id="currentTime">0:00</span>
          <span id="totalDuration">0:00</span>
        </div>
      </div>

      <!-- Control Buttons -->
      <div class="controls">
        <button class="btn-action" id="prevBtn" title="Previous"><i class="fa-solid fa-backward-step"></i></button>
        <button class="btn-action btn-play" id="playBtn" title="Play/Pause"><i class="fa-solid fa-play" id="playIcon"></i></button>
        <button class="btn-action" id="nextBtn" title="Next"><i class="fa-solid fa-forward-step"></i></button>
      </div>
    </section>

    <!-- Playlist Sidebar -->
    <aside class="playlist-card">
      <div class="playlist-header">
        <span>Library Tracks</span>
        <span class="playlist-count" id="trackCount">0 tracks</span>
      </div>
      <div class="playlist-items" id="playlistContainer"></div>
    </aside>
  </main>

      },
      {
        id: 'nc_17',
        title: 'പ്രായം നമ്മിൽ മോഹം നൽകി (Prayam Nammil)',
        artist: 'Evergreen Classic',
        duration: '4:10',
        cover: 'https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=400&q=80',
        url: getNcUrl('പ്രായം നമ്മിൽ മോഹം നൽകി Prayam Nammil Moham Nira...mp3')
      },
      {
        id: 'nc_18',
        title: 'രാക്കുയിൽ പാടീ (Raakkuyil Paadi)',
        artist: 'Kunchacko Boban Hits',
        duration: '4:25',
        cover: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400&q=80',
        url: getNcUrl('രാക്കുയിൽ പാടീ HD Raakkuyil Paadi Video Song Kunchacko Bo...mp3')
      }
    ];

    // DOM ELEMENTS
    const audio = document.getElementById('audioElement');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const currentTitle = document.getElementById('currentTitle');
    const currentArtist = document.getElementById('currentArtist');
    const currentCover = document.getElementById('currentCover');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const currentTimeEl = document.getElementById('currentTime');
    const totalDurationEl = document.getElementById('totalDuration');
    const playlistContainer = document.getElementById('playlistContainer');
    const trackCount = document.getElementById('trackCount');
    const playerContainer = document.getElementById('playerContainer');
    const canvas = document.getElementById('visualizer');
    const canvasCtx = canvas.getContext('2d');

    let currentIndex = 0;
    let isPlaying = false;
    let audioCtx, analyser, source, dataArray;
    let visualizerInitialized = false;

    // RENDER PLAYLIST
    function buildPlaylist() {
      playlistContainer.innerHTML = '';
      trackCount.textContent = `${SONGS_LIST.length} tracks`;

      SONGS_LIST.forEach((song, index) => {
        const item = document.createElement('div');
        item.className = `track-item ${index === currentIndex ? 'active' : ''}`;
        item.onclick = () => selectTrack(index);

        item.innerHTML = `
          <img class="item-cover" src="${song.cover}" alt="cover" />
          <div class="item-details">
            <div class="item-title">${song.title}</div>
            <div class="item-artist">${song.artist}</div>
          </div>
          <div style="font-size: 0.75rem; color: var(--text-sub);">${song.duration}</div>
        `;
        playlistContainer.appendChild(item);
      });
    }

    // LOAD TRACK
    function loadTrack(index) {
      currentIndex = index;
      const song = SONGS_LIST[currentIndex];
      audio.src = song.url;
      currentTitle.textContent = song.title;
      currentArtist.textContent = song.artist;
      currentCover.src = song.cover;

      document.querySelectorAll('.track-item').forEach((el, i) => {
        el.classList.toggle('active', i === currentIndex);
      });
    }

    function selectTrack(index) {
      loadTrack(index);
      playTrack();
    }

    function playTrack() {
      initVisualizer();
      audio.play().then(() => {
        isPlaying = true;
        playIcon.className = 'fa-solid fa-pause';
        playerContainer.classList.add('playing');
      }).catch(err => {
        console.error("Playback error:", err);
      });
    }

    function pauseTrack() {
      audio.pause();
      isPlaying = false;
      playIcon.className = 'fa-solid fa-play';
      playerContainer.classList.remove('playing');
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        pauseTrack();
      } else {
        playTrack();
      }
    });

    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + SONGS_LIST.length) % SONGS_LIST.length;
      loadTrack(currentIndex);
      playTrack();
    });

    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % SONGS_LIST.length;
      loadTrack(currentIndex);
      playTrack();
    });

    audio.addEventListener('ended', () => {
      nextBtn.click();
    });

    // PROGRESS BAR UPDATES
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = `${pct}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        totalDurationEl.textContent = formatTime(audio.duration);
      }
    });

    progressContainer.addEventListener('click', (e) => {
      const rect = progressContainer.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const width = rect.width;
      if (audio.duration) {
        audio.currentTime = (clickX / width) * audio.duration;
      }
    });

    function formatTime(sec) {
      const mins = Math.floor(sec / 60);
      const secs = Math.floor(sec % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // AUDIO VISUALIZER
    function initVisualizer() {
      if (visualizerInitialized) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyser.fftSize = 64;
        const bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);
        visualizerInitialized = true;
        renderVisualizer();
      } catch (e) {
        console.warn("Visualizer Web Audio API context initialization skipped:", e);
      }
    }

    function renderVisualizer() {
      requestAnimationFrame(renderVisualizer);
      if (!visualizerInitialized) return;

      analyser.getByteFrequencyData(dataArray);
      canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

      const barWidth = (canvas.width / dataArray.length) * 1.5;
      let x = 0;

      for (let i = 0; i < dataArray.length; i++) {
        const barHeight = (dataArray[i] / 255) * canvas.height;
        const grad = canvasCtx.createLinearGradient(0, canvas.height, 0, 0);
        grad.addColorStop(0, '#06b6d4');
        grad.addColorStop(1, '#38bdf8');

        canvasCtx.fillStyle = grad;
        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);
        x += barWidth;
      }
    }

    // RESIZE CANVAS DYNAMICALLY
    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth - 80;
      canvas.height = 70;
    }
    window.addEventListener('resize', resizeCanvas);

    // INITIALIZATION
    window.addEventListener('DOMContentLoaded', () => {
      buildPlaylist();
      loadTrack(0);
      resizeCanvas();
    });
  </script>
</body>
