<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Paradise of Songs</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#0a0d14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Paradise Songs" />
  <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=192&h=192&fit=crop" />

  <!-- Embedded Web App Manifest for Desktop/Mobile Installation -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Paradise of Songs","short_name":"ParadiseMusic","start_url":".","display":"standalone","background_color":"#0a0d14","theme_color":"#1ed760","icons":[{"src":"https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=192&h=192&fit=crop","sizes":"192x192","type":"image/png"},{"src":"https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=512&h=512&fit=crop","sizes":"512x512","type":"image/png"}]}' />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --spotify-green: #1ed760;
      --spotify-green-hover: #1fdf64;
      --spotify-green-glow: rgba(30, 215, 96, 0.35);
      --bg-base: #06090f;
      --surface-glass: rgba(18, 24, 38, 0.65);
      --surface-border: rgba(255, 255, 255, 0.08);
      --text-bright: #ffffff;
      --text-dim: #94a3b8;
      --accent-glow: rgba(30, 215, 96, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-bright);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Wallpaper Layer */
    #ambientBg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.8s ease;
      filter: blur(40px) brightness(0.35);
      transform: scale(1.1);
    }

    #ambientOverlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at 20% 20%, rgba(30, 215, 96, 0.08), transparent 45%),
                  radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.08), transparent 45%),
                  rgba(6, 9, 15, 0.85);
    }

    /* Header */
    header {
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(10, 13, 20, 0.5);
      border-bottom: 1px solid var(--surface-border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand i {
      color: var(--spotify-green);
      text-shadow: 0 0 16px var(--spotify-green-glow);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--surface-border);
      color: var(--text-bright);
      padding: 8px 14px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .pill-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }

    .pill-btn.install-btn {
      background: var(--spotify-green);
      color: #041008;
      border-color: var(--spotify-green);
      display: none;
    }

    .pill-btn.install-btn:hover {
      background: var(--spotify-green-hover);
      box-shadow: 0 0 20px var(--spotify-green-glow);
    }

    /* Main Container */
    .main-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 28px;
      padding: 28px 32px;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 960px) {
      .main-grid {
        grid-template-columns: 1fr;
        padding: 16px;
        gap: 20px;
      }
      header {
        padding: 14px 18px;
      }
    }

    /* Player Box */
    .player-deck {
      background: var(--surface-glass);
      border: 1px solid var(--surface-border);
      border-radius: 28px;
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .cover-shell {
      width: 280px;
      height: 280px;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 26px;
      position: relative;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    @media (max-width: 480px) {
      .cover-shell {
        width: 220px;
        height: 220px;
      }
      .player-deck {
        padding: 24px 16px;
      }
    }

    .cover-shell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .playing .cover-shell img {
      transform: scale(1.06);
    }

    .track-info {
      text-align: center;
      margin-bottom: 18px;
      width: 100%;
    }

    .track-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-artist {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-dim);
    }

    /* Visualizer Canvas */
    #visualizer {
      width: 100%;
      height: 60px;
      margin-bottom: 20px;
    }

    /* Scrubber */
    .scrubber-zone {
      width: 100%;
      max-width: 600px;
      margin-bottom: 24px;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      position: relative;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--spotify-green);
      border-radius: 9999px;
      box-shadow: 0 0 12px var(--spotify-green-glow);
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-dim);
      margin-top: 8px;
    }

    /* Transport Controls */
    .controls-deck {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 1.3rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      transform: scale(1.08);
    }

    .btn-main-play {
      width: 68px;
      height: 68px;
      background: var(--spotify-green);
      color: #041008;
      font-size: 1.6rem;
      border-radius: 50%;
      box-shadow: 0 8px 30px var(--spotify-green-glow);
    }

    .btn-main-play:hover {
      background: var(--spotify-green-hover);
      transform: scale(1.08);
      color: #041008;
    }

    /* Playlist Sidecar */
    .sidecar-deck {
      background: var(--surface-glass);
      border: 1px solid var(--surface-border);
      border-radius: 28px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      max-height: 720px;
    }

    .sidecar-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidecar-counter {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--spotify-green);
      background: rgba(30, 215, 96, 0.12);
      padding: 3px 10px;
      border-radius: 9999px;
    }

    .playlist-scroll {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }

    .playlist-scroll::-webkit-scrollbar {
      width: 5px;
    }

    .playlist-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }

    .song-cell {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .song-cell:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .song-cell.active {
      background: rgba(30, 215, 96, 0.15);
      border: 1px solid rgba(30, 215, 96, 0.3);
    }

    .song-cell.active .cell-title {
      color: var(--spotify-green);
    }

    .cell-thumb {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
    }

    .cell-texts {
      flex: 1;
      overflow: hidden;
    }

    .cell-title {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cell-artist {
      font-size: 0.75rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Modal for Custom Background */
    .bg-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .bg-modal.open {
      display: flex;
    }

    .modal-sheet {
      background: #111624;
      border: 1px solid var(--surface-border);
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      padding: 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
    }

    .modal-sheet h3 {
      font-size: 1.25rem;
      margin-bottom: 8px;
    }

    .modal-sheet p {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .preset-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .preset-dot {
      height: 48px;
      border-radius: 10px;
      cursor: pointer;
      background-size: cover;
      background-position: center;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .preset-dot:hover {
      border-color: var(--spotify-green);
      transform: scale(1.05);
    }

    .file-input-wrapper {
      position: relative;
      margin-bottom: 16px;
    }

    .file-input-wrapper input[type="file"] {
      display: none;
    }

    .custom-upload-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: var(--text-bright);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .custom-upload-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: var(--spotify-green);
    }

    .modal-btn-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Ambient Dynamic Wallpapers -->
  <div id="ambientBg"></div>
  <div id="ambientOverlay"></div>

  <!-- Header -->
  <header>
    <div class="brand">
      <i class="fa-solid fa-record-vinyl fa-spin" style="--fa-animation-duration: 5s;"></i>
      <span>Paradise of Songs</span>
    </div>
    <div class="header-actions">
      <button class="pill-btn install-btn" id="installPwaBtn">
        <i class="fa-solid fa-download"></i> Install App
      </button>
      <button class="pill-btn" id="openBgModalBtn">
        <i class="fa-solid fa-palette"></i> Wallpaper
      </button>
    </div>
  </header>

  <!-- Main Grid -->
  <main class="main-grid">
    <!-- Active Player Unit -->
    <section class="player-deck" id="playerDeck">
      <div class="cover-shell">
        <img id="mainCover" src="" alt="Album Artwork" />
      </div>

      <div class="track-info">
        <div class="track-title" id="mainTitle">Select a track</div>
        <div class="track-artist" id="mainArtist">Paradise Records</div>
      </div>

      <canvas id="visualizer"></canvas>

      <div class="scrubber-zone">
        <div class="progress-track" id="progressTrack">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-labels">
          <span id="elapsedTime">0:00</span>
          <span id="totalTime">0:00</span>
        </div>
      </div>

      <div class="controls-deck">
        <button class="icon-btn" id="prevTrackBtn" title="Previous"><i class="fa-solid fa-backward-step"></i></button>
        <button class="icon-btn btn-main-play" id="playToggleBtn" title="Play"><i class="fa-solid fa-play" id="playIcon"></i></button>
        <button class="icon-btn" id="nextTrackBtn" title="Next"><i class="fa-solid fa-forward-step"></i></button>
      </div>
    </section>

    <!-- Side Playlist Deck -->
    <aside class="sidecar-deck">
      <div class="sidecar-title">
        <span>Library Tracks</span>
        <span class="sidecar-counter" id="songCounter">18 Songs</span>
      </div>
      <div class="playlist-scroll" id="songRows"></div>
    </aside>
  </main>

  <!-- Background Customizer Modal -->
  <div class="bg-modal" id="bgModal">
    <div class="modal-sheet">
      <h3>Personalize Theme</h3>
      <p>Choose an ambient preset or upload your own wallpaper from your device.</p>

      <div class="preset-row">
        <div class="preset-dot" style="background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=300&q=80');" onclick="applyPreset('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1600&q=80')"></div>
        <div class="preset-dot" style="background-image: url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&q=80');" onclick="applyPreset('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=1600&q=80')"></div>
        <div class="preset-dot" style="background-image: url('https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300&q=80');" onclick="applyPreset('https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=1600&q=80')"></div>
        <div class="preset-dot" style="background-image: url('https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=300&q=80');" onclick="applyPreset('https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=1600&q=80')"></div>
      </div>

      <div class="file-input-wrapper">
        <label for="customImgUpload" class="custom-upload-btn">
          <i class="fa-solid fa-cloud-arrow-up"></i> Upload From Device
        </label>
        <input type="file" id="customImgUpload" accept="image/*" />
      </div>

      <div class="modal-btn-row">
        <button class="pill-btn" onclick="resetDefaultTheme()">Default Theme</button>
        <button class="pill-btn" onclick="closeBgModal()">Done</button>
      </div>
    </div>
  </div>

      { id: 't16', title: 'Pavazha Malli', artist: 'Sai Abhyankkar, Shruti Haasan', duration: '3:34', cover: 'https://images.unsplash.com/photo-1506157786151-b8491531f063?w=500&q=80', url: getNcUrl('Pavazha Malli - Sai Abhyankkar, Shruti Haasan.mp3') },
      { id: 't17', title: 'പ്രായം നമ്മിൽ മോഹം നൽകി', artist: 'Evergreen Classic', duration: '4:10', cover: 'https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=500&q=80', url: getNcUrl('പ്രായം നമ്മിൽ മോഹം നൽകി Prayam Nammil Moham Nira...mp3') },
      { id: 't18', title: 'രാക്കുയിൽ പാടീ', artist: 'Kunchacko Boban Hits', duration: '4:25', cover: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500&q=80', url: getNcUrl('രാക്കുയിൽ പാടീ HD Raakkuyil Paadi Video Song Kunchacko Bo...mp3') }
    ];

    // -------------------------------------------------------------------------
    // 2. STATE & ELEMENT BINDINGS
    // -------------------------------------------------------------------------
    let currentIdx = 0;
    let isPlaying = false;
    let audioCtx, analyser, sourceNode, freqData;
    let isVisualizerReady = false;

    const audio = document.getElementById('audioEngine');
    const mainTitle = document.getElementById('mainTitle');
    const mainArtist = document.getElementById('mainArtist');
    const mainCover = document.getElementById('mainCover');
    const playToggleBtn = document.getElementById('playToggleBtn');
    const playIcon = document.getElementById('playIcon');
    const prevTrackBtn = document.getElementById('prevTrackBtn');
    const nextTrackBtn = document.getElementById('nextTrackBtn');
    const progressTrack = document.getElementById('progressTrack');
    const progressFill = document.getElementById('progressFill');
    const elapsedTime = document.getElementById('elapsedTime');
    const totalTime = document.getElementById('totalTime');
    const songRows = document.getElementById('songRows');
    const playerDeck = document.getElementById('playerDeck');
    const ambientBg = document.getElementById('ambientBg');
    const canvas = document.getElementById('visualizer');
    const canvasCtx = canvas.getContext('2d');

    // -------------------------------------------------------------------------
    // 3. PLAYLIST RENDERING
    // -------------------------------------------------------------------------
    function renderPlaylist() {
      songRows.innerHTML = '';
      TRACKS.forEach((track, idx) => {
        const item = document.createElement('div');
        item.className = `song-cell ${idx === currentIdx ? 'active' : ''}`;
        item.onclick = () => {
          loadTrack(idx);
          startPlayback();
        };

        item.innerHTML = `
          <img class="cell-thumb" src="${track.cover}" alt="Artwork" />
          <div class="cell-texts">
            <div class="cell-title">${track.title}</div>
            <div class="cell-artist">${track.artist}</div>
          </div>
          <span style="font-size: 0.72rem; color: var(--text-dim);">${track.duration}</span>
        `;
        songRows.appendChild(item);
      });
    }

    // -------------------------------------------------------------------------
    // 4. LOAD & SYNC TRACK + BACKGROUND PLAYBACK (MEDIA SESSION API)
    // -------------------------------------------------------------------------
    function loadTrack(index) {
      currentIdx = index;
      const track = TRACKS[currentIdx];
      audio.src = track.url;
      mainTitle.textContent = track.title;
      mainArtist.textContent = track.artist;
      mainCover.src = track.cover;

      // Update ambient glow if user didn't lock a custom wallpaper
      if (!localStorage.getItem('customUserBg')) {
        ambientBg.style.backgroundImage = `url('${track.cover}')`;
      }

      document.querySelectorAll('.song-cell').forEach((el, i) => {
        el.classList.toggle('active', i === currentIdx);
      });

      // Enable Mobile Lock-Screen Controls & Background Playback
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title,
          artist: track.artist,
          album: 'Paradise of Songs',
          artwork: [
            { src: track.cover, sizes: '96x96', type: 'image/jpeg' },
            { src: track.cover, sizes: '192x192', type: 'image/jpeg' },
            { src: track.cover, sizes: '512x512', type: 'image/jpeg' }
          ]
        });

        navigator.mediaSession.setActionHandler('play', () => startPlayback());
        navigator.mediaSession.setActionHandler('pause', () => pausePlayback());
        navigator.mediaSession.setActionHandler('previoustrack', () => prevTrackBtn.click());
        navigator.mediaSession.setActionHandler('nexttrack', () => nextTrackBtn.click());
        navigator.mediaSession.setActionHandler('seekto', (details) => {
          if (details.seekTime && audio.duration) audio.currentTime = details.seekTime;
        });
      }
    }

    function startPlayback() {
      setupVisualizer();
      audio.play().then(() => {
        isPlaying = true;
        playIcon.className = 'fa-solid fa-pause';
        playerDeck.classList.add('playing');
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
      }).catch(e => console.warn('Autoplay restricted:', e));
    }

    function pausePlayback() {
      audio.pause();
      isPlaying = false;
      playIcon.className = 'fa-solid fa-play';
      playerDeck.classList.remove('playing');
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    }

    playToggleBtn.onclick = () => (isPlaying ? pausePlayback() : startPlayback());

    prevTrackBtn.onclick = () => {
      currentIdx = (currentIdx - 1 + TRACKS.length) % TRACKS.length;
      loadTrack(currentIdx);
      startPlayback();
    };

    nextTrackBtn.onclick = () => {
      currentIdx = (currentIdx + 1) % TRACKS.length;
      loadTrack(currentIdx);
      startPlayback();
    };

    audio.onended = () => nextTrackBtn.click();

    // -------------------------------------------------------------------------
    // 5. PROGRESS & SCRUBBER
    // -------------------------------------------------------------------------
    audio.ontimeupdate = () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${pct}%`;
        elapsedTime.textContent = formatDuration(audio.currentTime);
        totalTime.textContent = formatDuration(audio.duration);
      }
    };

    progressTrack.onclick = (e) => {
      const rect = progressTrack.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      if (audio.duration) {
        audio.currentTime = (clickX / rect.width) * audio.duration;
      }
    };

    function formatDuration(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // -------------------------------------------------------------------------
    // 6. CANVAS AUDIO VISUALIZER
    // -------------------------------------------------------------------------
    function setupVisualizer() {
      if (isVisualizerReady) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        sourceNode = audioCtx.createMediaElementSource(audio);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyser.fftSize = 64;
        freqData = new Uint8Array(analyser.frequencyBinCount);
        isVisualizerReady = true;
        paintVisualizer();
      } catch (err) {
        console.warn('Web Audio node initialized with restrictions:', err);
      }
    }

    function paintVisualizer() {
      requestAnimationFrame(paintVisualizer);
      if (!isVisualizerReady) return;

      analyser.getByteFrequencyData(freqData);
      canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

      const barWidth = (canvas.width / freqData.length) * 1.6;
      let x = 0;

      for (let i = 0; i < freqData.length; i++) {
        const barHeight = (freqData[i] / 255) * canvas.height;
        const grad = canvasCtx.createLinearGradient(0, canvas.height, 0, 0);
        grad.addColorStop(0, '#1ed760');
        grad.addColorStop(1, '#0ea5e9');

        canvasCtx.fillStyle = grad;
        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 3, barHeight);
        x += barWidth;
      }
    }

    function adjustCanvasBounds() {
      canvas.width = canvas.parentElement.clientWidth - 64;
      canvas.height = 60;
    }
    window.addEventListener('resize', adjustCanvasBounds);

    // -------------------------------------------------------------------------
    // 7. USER CUSTOM WALLPAPER (LOCAL STORAGE PERSISTENCE)
    // -------------------------------------------------------------------------
    const bgModal = document.getElementById('bgModal');
    const openBgModalBtn = document.getElementById('openBgModalBtn');
    const customImgUpload = document.getElementById('customImgUpload');

    openBgModalBtn.onclick = () => bgModal.classList.add('open');
    function closeBgModal() { bgModal.classList.remove('open'); }

    function applyPreset(url) {
      ambientBg.style.backgroundImage = `url('${url}')`;
      localStorage.setItem('customUserBg', url);
    }

    function resetDefaultTheme() {
      localStorage.removeItem('customUserBg');
      ambientBg.style.backgroundImage = `url('${TRACKS[currentIdx].cover}')`;
      closeBgModal();
    }

    customImgUpload.onchange = function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const dataUrl = evt.target.result;
          ambientBg.style.backgroundImage = `url('${dataUrl}')`;
          try {
            localStorage.setItem('customUserBg', dataUrl);
          } catch(err) {
            console.warn('Image exceeds local storage quote limit:', err);
          }
          closeBgModal();
        };
        reader.readAsDataURL(file);
      }
    };

    // Restore saved custom background if present
    const savedBg = localStorage.getItem('customUserBg');
    if (savedBg) {
      ambientBg.style.backgroundImage = `url('${savedBg}')`;
    }

    // -------------------------------------------------------------------------
    // 8. PWA INSTALLATION BANNER (LAPTOP / DESKTOP / MOBILE)
    // -------------------------------------------------------------------------
    let deferredPrompt;
    const installBtn = document.getElementById('installPwaBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-flex';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBtn.style.display = 'none';
        }
        deferredPrompt = null;
      }
    });

    // Register Inline Service Worker for Full Offline PWA compliance
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => self.clients.claim());
        self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    // -------------------------------------------------------------------------
    // 9. STARTUP SEQUENCE
    // -------------------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      renderPlaylist();
      loadTrack(0);
      adjustCanvasBounds();
    });
  </script>
</body>
</html>
