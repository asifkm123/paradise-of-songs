<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paradise of Songs</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg-dark: #0a0e17;
      --card-bg: rgba(22, 27, 34, 0.75);
      --accent: #1ed760;
      --accent-glow: rgba(30, 215, 96, 0.35);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --fav-color: #ef4444;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 120px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Header & Branding */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 4px;
    }
    header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }
    header span { color: var(--accent); }

    /* Search & Voice Bar */
    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .search-icon { color: var(--text-muted); font-size: 0.95rem; margin-right: 10px; }
    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.95rem;
      padding: 10px 0;
    }
    .search-input::placeholder { color: var(--text-muted); font-size: 0.85rem; }
    .voice-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 6px 10px;
      border-radius: 50%;
      transition: all 0.2s ease;
    }
    .voice-btn:hover { color: var(--accent); }
    .voice-btn.listening {
      color: #ef4444;
      animation: pulse 1.2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.7; }
    }

    /* Filter Tabs (All / Favorites) */
    .filter-tabs {
      display: flex;
      gap: 8px;
    }
    .tab-btn {
      padding: 6px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    /* Active Player Card */
    .player-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    .cover-art {
      width: 170px;
      height: 170px;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      margin-bottom: 16px;
    }
    .track-info { width: 100%; margin-bottom: 16px; }
    .track-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Progress & Duration */
    .timeline-container { width: 100%; margin-bottom: 16px; }
    .seek-slider {
      width: 100%;
      -webkit-appearance: none;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      cursor: pointer;
    }
    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }
    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Primary Player Controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      width: 100%;
      margin-bottom: 18px;
    }
    .ctrl-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      transition: color 0.2s;
    }
    .ctrl-btn:hover { color: var(--accent); }
    .ctrl-btn.play-btn {
      background: var(--accent);
      color: #000;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .ctrl-btn.fav-toggle.is-fav {
      color: var(--fav-color);
    }

    /* Volume Controller Bar */
    .volume-box {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
    }
    .volume-icon { color: var(--text-muted); font-size: 0.95rem; cursor: pointer; }
    .volume-slider {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      cursor: pointer;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    /* Tracklist Area */
    .playlist-wrapper h3 {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }
    .tracklist {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .track-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .track-row:hover { background: rgba(30, 215, 96, 0.08); border-color: rgba(30, 215, 96, 0.3); }
    .track-row.active {
      background: rgba(30, 215, 96, 0.12);
      border-color: var(--accent);
    }
    .row-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .row-left i { font-size: 0.9rem; color: var(--text-muted); }
    .row-meta { min-width: 0; }
    .row-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row-artist { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    .row-fav {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      cursor: pointer;
      padding: 6px;
    }
    .row-fav.is-fav { color: var(--fav-color); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Paradise <span>Audio</span></h1>
      <span id="track-count" style="font-size: 0.8rem; color: var(--text-muted);">Syncing...</span>
    </header>

    <!-- Search & Speech Recognition -->
    <div class="search-wrapper">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="Search track or artist..." />
      <button id="voiceBtn" class="voice-btn" title="Voice Search">
        <i class="fa-solid fa-microphone"></i>
      </button>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
      <button class="tab-btn active" id="tabAll"><i class="fa-solid fa-list"></i> All Songs</button>
      <button class="tab-btn" id="tabFavs"><i class="fa-solid fa-heart"></i> Favorites</button>
    </div>

    <!-- Active Song Visual Card -->
    <div class="player-card">
      <img id="currentCover" class="cover-art" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&q=80" alt="Cover" />
      <div class="track-info">
        <div id="currentTitle" class="track-title">Select a Song</div>
        <div id="currentArtist" class="track-artist">Paradise Cloud Stream</div>
      </div>

      <!-- Timeline -->
      <div class="timeline-container">
        <input type="range" id="seekSlider" class="seek-slider" min="0" max="100" value="0" />
        <div class="time-stamps">
          <span id="currTime">0:00</span>
          <span id="totalDur">0:00</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button id="favCurrentBtn" class="ctrl-btn fav-toggle" title="Add to Favorites"><i class="fa-regular fa-heart"></i></button>
        <button id="prevBtn" class="ctrl-btn"><i class="fa-solid fa-backward-step"></i></button>
        <button id="playBtn" class="ctrl-btn play-btn"><i class="fa-solid fa-play"></i></button>
        <button id="nextBtn" class="ctrl-btn"><i class="fa-solid fa-forward-step"></i></button>
      </div>

      <!-- Volume Controller -->
      <div class="volume-box">
        <i id="volumeIcon" class="fa-solid fa-volume-high volume-icon"></i>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.8" />
      </div>
    </div>

    <!-- Tracklist -->
    <div class="playlist-wrapper">
      <div class="tracklist" id="tracklistContainer"></div>
    </div>
  </div>

  <audio id="audio"></audio>

  <script>
    const WORKER_API = "https://proud-recipe-96deparadise-music-sync.paradiseacademy-kl.workers.dev/";
    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("playBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const seekSlider = document.getElementById("seekSlider");
    const volumeSlider = document.getElementById("volumeSlider");
    const volumeIcon = document.getElementById("volumeIcon");
    const currTime = document.getElementById("currTime");
    const totalDur = document.getElementById("totalDur");
    const currentTitle = document.getElementById("currentTitle");
    const currentArtist = document.getElementById("currentArtist");
    const currentCover = document.getElementById("currentCover");
    const favCurrentBtn = document.getElementById("favCurrentBtn");
    const tracklistContainer = document.getElementById("tracklistContainer");
    const trackCount = document.getElementById("trackCount");
    const searchInput = document.getElementById("searchInput");
    const voiceBtn = document.getElementById("voiceBtn");
    const tabAll = document.getElementById("tabAll");
    const tabFavs = document.getElementById("tabFavs");

    let allTracks = [];
    let displayedTracks = [];
    let currentIndex = 0;
    let favorites = JSON.parse(localStorage.getItem("paradise_favs") || "[]");
    let activeFilter = "all";

    // 1. Fetch live Nextcloud repository from Worker API
    async function loadTracks() {
      try {
        const res = await fetch(WORKER_API);
        allTracks = await res.json();
        applyFilterAndRender();
        if (allTracks.length > 0) {
          selectTrack(0, false);
        }
      } catch (err) {
        currentTitle.textContent = "Failed to load playlist";
      }
    }

    // 2. Render Tracklist
    function renderList(tracks) {
      tracklistContainer.innerHTML = "";
      if (tracks.length === 0) {
        tracklistContainer.innerHTML = `<div style="text-align:center; color:#94a3b8; padding:20px; font-size:0.85rem;">No matching songs found</div>`;
        return;
      }

      tracks.forEach((track, idx) => {
        const isFav = favorites.includes(track.title);
        const row = document.createElement("div");
        row.className = `track-row ${allTracks[currentIndex]?.title === track.title ? "active" : ""}`;
        row.innerHTML = `
          <div class="row-left">
            <i class="fa-solid fa-music"></i>
            <div class="row-meta">
              <div class="row-title">${track.title}</div>
              <div class="row-artist">${track.artist}</div>
            </div>
          </div>
          <button class="row-fav ${isFav ? 'is-fav' : ''}" data-title="${encodeURIComponent(track.title)}">
            <i class="fa-${isFav ? 'solid' : 'regular'} fa-heart"></i>
          </button>
        `;

        row.addEventListener("click", (e) => {
          if (e.target.closest(".row-fav")) return;
          const originalIdx = allTracks.findIndex(t => t.title === track.title);
          selectTrack(originalIdx, true);
        });

        row.querySelector(".row-fav").addEventListener("click", (e) => {
          e.stopPropagation();
          toggleFavorite(track.title);
        });

        tracklistContainer.appendChild(row);
      });
    }

    function selectTrack(index, autoplay = true) {
      if (index < 0 || index >= allTracks.length) return;
      currentIndex = index;
      const track = allTracks[currentIndex];

      audio.src = track.url;
      currentTitle.textContent = track.title;
      currentArtist.textContent = track.artist;
      currentCover.src = track.cover;

      updateFavIcon();
      applyFilterAndRender();

      if (autoplay) {
        audio.play().then(() => updatePlayIcon(true)).catch(() => updatePlayIcon(false));
      }
    }

    // 3. Playback Controls
    playBtn.addEventListener("click", () => {
      if (audio.paused) {
        audio.play();
        updatePlayIcon(true);
      } else {
        audio.pause();
        updatePlayIcon(false);
      }
    });

    prevBtn.addEventListener("click", () => {
      const newIdx = (currentIndex - 1 + allTracks.length) % allTracks.length;
      selectTrack(newIdx, true);
    });

    nextBtn.addEventListener("click", () => {
      const newIdx = (currentIndex + 1) % allTracks.length;
      selectTrack(newIdx, true);
    });

    audio.addEventListener("ended", () => {
      const newIdx = (currentIndex + 1) % allTracks.length;
      selectTrack(newIdx, true);
    });

    function updatePlayIcon(isPlaying) {
      playBtn.innerHTML = isPlaying ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
    }

    // 4. Progress Seek
    audio.addEventListener("timeupdate", () => {
      if (!isNaN(audio.duration)) {
        seekSlider.value = (audio.currentTime / audio.duration) * 100;
        currTime.textContent = formatTime(audio.currentTime);
        totalDur.textContent = formatTime(audio.duration);
      }
    });

    seekSlider.addEventListener("input", () => {
      if (!isNaN(audio.duration)) {
        audio.currentTime = (seekSlider.value / 100) * audio.duration;
      }
    });

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // 5. Volume Controller
    volumeSlider.addEventListener("input", (e) => {
      const val = parseFloat(e.target.value);
      audio.volume = val;
      updateVolumeIcon(val);
    });

    volumeIcon.addEventListener("click", () => {
      if (audio.volume > 0) {
        audio.dataset.prevVolume = audio.volume;
        audio.volume = 0;
        volumeSlider.value = 0;
      } else {
        const prev = parseFloat(audio.dataset.prevVolume || "0.8");
        audio.volume = prev;
        volumeSlider.value = prev;
      }
      updateVolumeIcon(audio.volume);
    });

    function updateVolumeIcon(val) {
      if (val === 0) volumeIcon.className = "fa-solid fa-volume-xmark volume-icon";
      else if (val < 0.5) volumeIcon.className = "fa-solid fa-volume-low volume-icon";
      else volumeIcon.className = "fa-solid fa-volume-high volume-icon";
    }

    // 6. Favorites Feature
    function toggleFavorite(title) {
      if (favorites.includes(title)) {
        favorites = favorites.filter(t => t !== title);
      } else {
        favorites.push(title);
      }
      localStorage.setItem("paradise_favs", JSON.stringify(favorites));
      updateFavIcon();
      applyFilterAndRender();
    }

    favCurrentBtn.addEventListener("click", () => {
      if (allTracks[currentIndex]) {
        toggleFavorite(allTracks[currentIndex].title);
      }
    });

    function updateFavIcon() {
      const isFav = favorites.includes(allTracks[currentIndex]?.title);
      favCurrentBtn.className = `ctrl-btn fav-toggle ${isFav ? 'is-fav' : ''}`;
      favCurrentBtn.innerHTML = `<i class="fa-${isFav ? 'solid' : 'regular'} fa-heart"></i>`;
    }

    tabAll.addEventListener("click", () => {
      activeFilter = "all";
      tabAll.classList.add("active");
      tabFavs.classList.remove("active");
      applyFilterAndRender();
    });

    tabFavs.addEventListener("click", () => {
      activeFilter = "favs";
      tabFavs.classList.add("active");
      tabAll.classList.remove("active");
      applyFilterAndRender();
    });

    // 7. Search & Filtering
    function applyFilterAndRender() {
      const query = searchInput.value.toLowerCase().trim();
      displayedTracks = allTracks.filter(track => {
        const matchesQuery = track.title.toLowerCase().includes(query) || track.artist.toLowerCase().includes(query);
        const matchesTab = (activeFilter === "all") || (activeFilter === "favs" && favorites.includes(track.title));
        return matchesQuery && matchesTab;
      });
      renderList(displayedTracks);
    }

    searchInput.addEventListener("input", applyFilterAndRender);

    // 8. Voice Search (Web Speech Recognition API)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = "en-US";

      voiceBtn.addEventListener("click", () => {
        try {
          recognition.start();
          voiceBtn.classList.add("listening");
        } catch(e) {
          recognition.stop();
          voiceBtn.classList.remove("listening");
        }
      });

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.replace(/\.$/, "");
        searchInput.value = transcript;
        applyFilterAndRender();
        voiceBtn.classList.remove("listening");
      };

      recognition.onerror = () => voiceBtn.classList.remove("listening");
      recognition.onend = () => voiceBtn.classList.remove("listening");
    } else {
      voiceBtn.style.display = "none";
    }

    loadTracks();
  </script>
</body>
</html>
